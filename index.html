  <style>

    .top-tab-btn.active { background: var(--accent); color: #0b1020; box-shadow: 0 2px 8px var(--accent-glow); }

    .inner { background: var(--card-inner); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 0.88rem; line-height: 1.65; }
    .muted { color: var(--muted); font-size: 0.9rem; line-height: 1.55; }
    .badge { display: inline-block; background: var(--accent-glow); color: var(--accent); padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; border: 1px solid var(--accent); }
    .badge.cardio { background: rgba(34,197,94,0.18); color: #4ade80; border-color: rgba(34,197,94,0.4); }
    .badge.optional { background: rgba(148,163,184,0.15); color: #cbd5e1; border-color: rgba(148,163,184,0.4); }
    .tag { display: inline-block; background: rgba(245,158,11,0.18); color: var(--warning); padding: 2px 6px; border-radius: 4px; font-size: 0.72rem; font-weight: bold; margin-left: 6px; }
    .tag.evening { background: var(--accent-glow); color: var(--accent); }
    .weeks-tracker { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 14px; border: 1px solid var(--border-color); }
    .weeks-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
    .week-btn { background: var(--card-inner); border: 1px solid var(--border-color); color: var(--muted); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 0.85rem; cursor: pointer; user-select: none; }
    .week-btn.checked { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); font-weight: bold; }
    .timer-bar { background: var(--card-inner); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; border: 1px solid var(--border-color); gap: 6px; flex-wrap: wrap; }
    .btn { background: var(--accent-dark); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
    .btn.ghost { background: none; border: 1px solid var(--danger); color: var(--danger); font-weight: normal; padding: 4px 8px; font-size: 0.75rem; }
    .day-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .day-progress { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
    .day-body.collapsed { display: none; }
    .todo-item { display: flex; align-items: flex-start; margin: 14px 0; font-size: 0.95rem; line-height: 1.4; }

    .todo-item.done .ex-name { text-decoration: line-through; opacity: 0.6; }
    .ex-body { flex: 1; min-width: 0; }
    .muscle { color: var(--accent); font-weight: 600; }
    .note { display: block; color: var(--muted); font-size: 0.82rem; margin-top: 3px; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
    .demo-btn { background: var(--accent-dark); color: #fff; border: none; font-size: 0.75rem; font-weight: bold; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .log { display: flex; gap: 4px; align-items: center; font-size: 0.75rem; color: var(--muted); }
    .log input { width: 54px; background: var(--bg); border: 1px solid var(--border-color); color: var(--text); border-radius: 6px; padding: 5px; font-size: 0.8rem; text-align: center; }
    .demo-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center; padding: 14px; }
    .demo-modal.active { display: flex; }
    .demo-content { background: var(--card); border-radius: 16px; width: 100%; max-width: 550px; overflow: hidden; border: 1px solid var(--border-color); }
    .demo-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--card-inner); border-bottom: 1px solid var(--border-color); }
    .demo-header h3 { margin: 0; color: #fff; }
    .close-btn { background: none; border: none; color: var(--danger); font-size: 1.6rem; font-weight: bold; cursor: pointer; }
    .demo-body { padding: 16px; }
    .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
    .video-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .yt-btn { display: block; background: #dc2626; color: #fff; text-decoration: none; text-align: center; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; margin-bottom: 12px; }
    .tips-box { background: var(--bg); border-radius: 10px; padding: 12px; border: 1px solid var(--border-color); font-size: 0.9rem; line-height: 1.5; }
    .tips-box strong { color: var(--accent); display: block; margin-bottom: 4px; }
    .tab-view { display: none; }
    .tab-view.active { display: block; }
    .macro-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; background: var(--card-inner); padding: 12px 6px; border-radius: 10px; margin-bottom: 14px; font-size: 0.82rem; border: 1px solid var(--border-color); }
    .macro-bar strong { display: block; color: var(--accent); font-size: 1rem; margin-bottom: 2px; }
    .stage-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .stage-table td, .stage-table th { border-bottom: 1px solid var(--border-color); padding: 7px 4px; text-align: right; }
    .stage-table th { color: var(--accent); font-weight: 600; }
    .opt { display: flex; gap: 10px; align-items: flex-start; background: var(--card-inner); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; margin: 8px 0; cursor: pointer; }
    .opt.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .opt input { margin-top: 3px; accent-color: var(--accent); width: 18px; height: 18px; flex-shrink: 0; }
    .opt-name { font-weight: bold; font-size: 0.93rem; }
    .opt-desc { color: var(--muted); font-size: 0.82rem; line-height: 1.5; margin: 3px 0; }
    .opt-macros { font-size: 0.78rem; color: var(--accent); }
    .total-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 2px solid var(--accent); padding: 10px 14px; display: none; z-index: 60; }
    .total-bar.show { display: block; }
    .total-grid { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; font-size: 0.78rem; max-width: 760px; margin: 0 auto; gap: 4px; }
    .total-grid strong { display: block; font-size: 0.98rem; }
    .ok { color: #4ade80; } .low { color: var(--warning); } .high { color: var(--danger); }
    ul.clean { margin: 6px 0; padding-right: 18px; }
    ul.clean li { margin: 5px 0; }
      .time-chip { display: inline-block; font-size: 0.78rem; color: var(--muted); margin-right: 8px; }
    .ex { background: var(--card-inner); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin: 10px 0; }
    .ex.in-ss { border-right: 4px solid var(--accent); }
    .ex.done { opacity: 0.55; }
    .ex.done .ex-name { text-decoration: line-through; }
    .ex-top { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
    .ex-top input { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; margin-top: 2px; }
    .ex-name { font-weight: bold; font-size: 1rem; line-height: 1.35; }
    .ex-en { color: var(--muted); font-size: 0.78rem; direction: ltr; text-align: right; }
    .ex-sets { color: var(--accent); font-weight: bold; font-size: 0.95rem; margin-top: 3px; }
    .ex-info { margin-top: 8px; padding-right: 32px; font-size: 0.88rem; line-height: 1.55; }
    .ex-info strong { color: #e2e8f0; }
    .how-title { margin-top: 6px; font-weight: bold; color: var(--accent); }
    ol.how { margin: 4px 0 6px; padding-right: 20px; }
    ol.how li { margin: 3px 0; }
    .video-btn { display: inline-block; margin-top: 6px; background: #dc2626; color: #fff; text-decoration: none; font-weight: bold; font-size: 0.85rem; padding: 8px 14px; border-radius: 8px; }
    .ss-start { margin: 14px 0 -2px; font-size: 0.82rem; font-weight: bold; color: var(--accent); }
    .ss-end { font-size: 0.78rem; color: var(--muted); margin: -2px 0 12px; }
    .day-label { font-size: 1.6rem; font-weight: 900; color: var(--accent); line-height: 1.2; }
    .day-label.cardio { color: #4ade80; }
    .day-label.optional { color: #cbd5e1; }
    .day-sub { margin: 2px 0 4px; display: flex; gap: 8px; align-items: center; }
    .day-sub .time-chip { margin: 0; }
    .opt-chip { background: rgba(148,163,184,0.2); color: #e2e8f0; border: 1px dashed #94a3b8; border-radius: 6px; padding: 2px 8px; font-size: 0.8rem; font-weight: bold; }
    .day-card { border-top: 4px solid var(--accent); scroll-margin-top: 70px; }

    .day-card.optional { border-top: 4px dashed #94a3b8; }
    .day-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .nav-chip { background: var(--card); color: var(--text); border: 1px solid var(--accent); border-radius: 20px; padding: 7px 12px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
    .nav-chip.cardio { border-color: #4ade80; }
    .nav-chip.optional { border-style: dashed; border-color: #94a3b8; color: #cbd5e1; }
    .ss-summary { background: var(--accent-glow); border: 1px solid var(--accent); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; font-weight: bold; margin: 6px 0 10px; }
    .ss-box { border: 3px solid var(--accent); border-radius: 14px; padding: 10px 8px 6px; margin: 16px 0; background: var(--accent-glow); }

    .ss-rule { font-size: 0.85rem; font-weight: bold; margin-top: 6px; line-height: 1.4; }

  <div class="brand-header">
    <div class="brand-title">
      <span class="brand-tag">S.K</span>

      </div>
    </div>
    <div id="days"></div>

    <div class="card" id="nutritionIntro"></div>
    <div class="card">

      <h2>בחר ארוחה מכל קטגוריה</h2>

      <div id="mealSections"></div>
    </div>
  </div>

  <div id="view-guide" class="tab-view">
    <div id="guideContent"></div>
  </div>

  <div class="total-bar" id="totalBar"><div class="total-grid" id="totalGrid"></div></div>

function el(tag, attrs, ...kids) {

    else if (k === 'html') n.innerHTML = v;

    else n.setAttribute(k, v);

  kids.flat().forEach(k => { if (k == null) return; n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); });

    let ssTag = null;
    if (ss) { pos++; const n = d.items.filter(i => i.superset === ss).length; ssTag = el('div', { class: 'ss-tag' }, 'סופר-סט ' + ss + ' · תרגיל ' + pos + ' מתוך ' + n + (pos < n ? ' ← מיד לתרגיל הבא' : ' ← עכשיו מנוחה')); }
    const top = el('label', { class: 'ex-top' }, cb, el('div', { class: 'ex-title' },
      ssTag,
      el('div', { class: 'ex-name' }, it.name, it.tag ? el('span', { class: 'tag' }, it.tag) : null),
      it.en ? el('div', { class: 'ex-en' }, it.en) : null,
      el('div', { class: 'ex-sets' }, it.sets)));
    row.appendChild(top);
    const info = el('div', { class: 'ex-info' });
    if (it.target) info.appendChild(el('div', null, '🎯 ', el('strong', null, 'עובד על: '), it.target));
    if (it.weight) info.appendChild(el('div', null, it.cardio ? '📌 ' : '⚖️ ', it.cardio ? '' : el('strong', null, 'משקל: '), it.weight));
    if (it.how && it.how.length) {
      info.appendChild(el('div', { class: 'how-title' }, 'איך מבצעים:'));
      info.appendChild(el('ol', { class: 'how' }, it.how.map(h => el('li', null, h))));
    }
    if (it.video) info.appendChild(el('a', { class: 'video-btn', href: 'https://www.youtube.com/watch?v=' + it.video, target: '_blank', rel: 'noopener' }, '▶ סרטון הדגמה'));
    row.appendChild(info);
    (ss ? box : body).appendChild(row);
    if (ss && nextSS !== ss) box.appendChild(el('div', { class: 'ss-foot' }, '⏸️ סוף סופר-סט ' + ss + ': מנוחה 60–90 שנ\', ואז עוד סבב של שני התרגילים'));
  });
  card.appendChild(body);
  daysWrap.appendChild(card);
  updateProg();
});

function resetWeek() {
  if (!confirm('לאפס את סימוני האימונים של השבוע?')) return;
  state.t = {}; save(); location.reload();
}

/* timer */
let timerInterval;
function startTimer(sec) {
  clearInterval(timerInterval);
  let t = sec; const d = document.getElementById('timerDisplay');
  d.textContent = t + ' שנ\'';
  timerInterval = setInterval(() => {
    t--;
    if (t <= 0) { clearInterval(timerInterval); d.textContent = 'צא לסט!'; if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
    else d.textContent = t + ' שנ\'';
  }, 1000);
}

/* nutrition */
const N = P.nutrition;
document.getElementById('macroBar').innerHTML = '';
[[N.target.kcal, 'קק"ל (יעד)'], [N.target.p, 'חלבון'], [N.target.c, 'פחמימה'], [N.target.f, 'שומן']].forEach(([v, l]) =>
  document.getElementById('macroBar').appendChild(el('div', null, el('strong', null, v), l)));
const ni = document.getElementById('nutritionIntro');
ni.appendChild(el('span', { class: 'badge' }, N.badge));
ni.appendChild(el('h2', null, N.title));
ni.appendChild(el('p', { class: 'muted', html: N.intro }));
if (N.stages) {
  const tbl = el('table', { class: 'stage-table' }, el('tr', null, el('th', null, 'שבועות'), el('th', null, 'קק"ל'), el('th', null, 'מה עושים')));
  N.stages.forEach(s => tbl.appendChild(el('tr', null, el('td', null, s[0]), el('td', null, s[1]), el('td', { html: s[2] }))));
  ni.appendChild(tbl);
}
ni.appendChild(el('h3', null, 'כללי הזהב של השלב'));
ni.appendChild(el('div', { class: 'inner' }, el('ul', { class: 'clean' }, N.rules.map(r => el('li', { html: r })))));

const ms = document.getElementById('mealSections');
N.meals.forEach(cat => {
  ms.appendChild(el('h3', null, cat.title));
  if (cat.hint) ms.appendChild(el('p', { class: 'muted', style: 'margin:0 0 4px; font-size:0.82rem;' }, cat.hint));
  const multi = !!cat.multi;
  const sel = state.meals[cat.id] || (multi ? [] : null);
  cat.options.forEach((o, oi) => {
    const inp = el('input', { type: multi ? 'checkbox' : 'radio', name: 'm_' + cat.id });
    inp.checked = multi ? sel.includes(oi) : sel === oi;
    const box = el('label', { class: 'opt' + (inp.checked ? ' selected' : '') }, inp,
      el('div', null,
        el('div', { class: 'opt-name' }, o.name, o.tag ? el('span', { class: 'tag' }, o.tag) : null),
        el('div', { class: 'opt-desc', html: o.desc }),
        el('div', { class: 'opt-macros' }, '~' + o.kcal + ' קק"ל | ' + o.p + ' ח׳ | ' + o.c + ' פ׳ | ' + o.f + ' ש׳')));
    inp.addEventListener('change', () => {
      if (multi) {
        let arr = state.meals[cat.id] || [];
        arr = inp.checked ? [...new Set([...arr, oi])] : arr.filter(x => x !== oi);
        state.meals[cat.id] = arr;
      } else state.meals[cat.id] = oi;
      ms.querySelectorAll('input[name="m_' + cat.id + '"]').forEach(x => x.closest('.opt').classList.toggle('selected', x.checked));
      save(); totals();
    });
    ms.appendChild(box);
  });
});
function totals() {
  const t = { kcal: 0, p: 0, c: 0, f: 0 };
  N.meals.forEach(cat => {
    const s = state.meals[cat.id];
    const idx = cat.multi ? (s || []) : (s == null ? [] : [s]);
    idx.forEach(i => { const o = cat.options[i]; if (o) { t.kcal += o.kcal; t.p += o.p; t.c += o.c; t.f += o.f; } });
  });
  const R = N.range;
  const cls = (v, [lo, hi], k) => v === 0 ? '' : v < lo ? 'low' : (v > hi && k !== 'p') ? 'high' : 'ok';
  const g = document.getElementById('totalGrid'); g.innerHTML = '';
  [['kcal', 'קק"ל'], ['p', 'חלבון'], ['c', 'פחמימה'], ['f', 'שומן']].forEach(([k, l]) =>
    g.appendChild(el('div', null, el('strong', { class: cls(t[k], R[k], k) }, String(Math.round(t[k]))), l + ' (' + R[k][0] + '–' + R[k][1] + ')')));
}
totals();

/* guide */
const gc = document.getElementById('guideContent');
P.guide.forEach(sec => {
  const c = el('div', { class: 'card' });
  c.appendChild(el('span', { class: 'badge' }, sec.badge));
  c.appendChild(el('h2', null, sec.title));
  if (sec.intro) c.appendChild(el('p', { class: 'muted', html: sec.intro }));
  if (sec.points) c.appendChild(el('div', { class: 'inner' }, el('ul', { class: 'clean' }, sec.points.map(p => el('li', { html: p })))));
  gc.appendChild(c);
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
